name: Build Android APK

on:
  workflow_dispatch:
      inputs:
        appVersion:
          description: 'Project Version (ex 1.0.0R)'
          required: true
          default: '2.0R'
          type: string
        androidVersionCode:
          description: 'Project Version Code (Andoroid, 1-999999. Ex 10)'
          required: true
          default: '1'
          type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build signed Release APK
    runs-on: ubuntu-latest
    environment: Cloud Unity Build
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Get Unity Version
        id: get_unity_version
        run: |
          UNITY_VERSION=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt | tr -d '\r')

          echo "Unity Version: $UNITY_VERSION"

          echo "version=$UNITY_VERSION" >> $GITHUB_OUTPUT
          
      - name: Validate Android Version Code
        run: |
          if ! [[ "${{ inputs.androidVersionCode }}" =~ ^[0-9]+$ ]]; then
            echo "Error: androidVersionCode should be a integer (ex 10), not a ${{ inputs.androidVersionCode }}"
            exit 1
          fi
            echo "Version Code is valid."

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ github.workspace }}
          unityVersion: ${{ steps.get_unity_version.outputs.version }}
          targetPlatform: Android
          buildName: com.WasteMoonGames.PoCIdle
          buildsPath: build
          versioning: Custom
          version: ${{ inputs.appVersion }}
          androidVersionCode: ${{ inputs.androidVersionCode }}
          androidExportType: androidPackage
          androidKeystoreName: PoC.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          apk_path="$(find build -type f -name '*.apk' -print -quit)"
          if [ -z "$apk_path" ]; then
            echo "APK was not produced" >&2
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.WasteMoonGames.PoCIdle
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Get artifact URL
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Получаем список артефактов для текущего run
          artifacts_json=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
          
          # Ищем артефакт по имени
          artifact_id=$(echo "$artifacts_json" | jq -r '.artifacts[] | select(.name == "com.WasteMoonGames.PoCIdle") | .id')
          
          if [ -z "$artifact_id" ] || [ "$artifact_id" = "null" ]; then
            echo "Failed to find artifact" >&2
            exit 1
          fi
          
          # Формируем URL для скачивания артефакта
          artifact_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${artifact_id}"
          echo "url=$artifact_url" >> "$GITHUB_OUTPUT"
          echo "Artifact URL: $artifact_url"

      - name: Send APK link to Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.url }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured" >&2
            exit 1
          fi
          
          telegram_url="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          json_payload=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "Release APK готов!
          
          com.WasteMoonGames.PoCIdle v${{ inputs.appVersion }} (code: ${{ inputs.androidVersionCode }})
          Unity Version: ${{ steps.get_unity_version.outputs.version }}
          
          Скачать артефакт:
          $ARTIFACT_URL" \
            '{chat_id: $chat_id, text: $text}')
          
          echo "Sending message to Telegram..."

          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$json_payload" \
            "$telegram_url")"

          if ! echo "$response" | grep -q '"ok":true'; then
            echo "Telegram API rejected message: $response" >&2
            exit 1
          fi

          echo "Telegram message sent successfully!"
